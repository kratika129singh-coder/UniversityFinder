<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World University Finder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f3f6fa;
      color: #1e293b;
      padding: 40px 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    header p {
      color: #64748b;
      font-size: 1rem;
    }

    /* Search Bar */
    .search-box {
      display: flex;
      gap: 10px;
      max-width: 560px;
      margin: 0 auto 24px auto;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .status-text {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 500;
      color: #475569;
    }

    /* Results Table */
    .table-wrapper {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background-color: #1e293b;
      color: #ffffff;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .badge-na {
      color: #94a3b8;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎓 University Directory</h1>
      <p>Enter a country name to fetch universities, their states/provinces, and official websites.</p>
    </header>

    <form class="search-box" id="searchForm">
      <input
        type="text"
        id="countryInput"
        placeholder="e.g., India, United States, Canada, Japan..."
        required
      />
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <p class="status-text" id="statusText">Try searching for "India" or "United Kingdom" above.</p>

    <div class="table-wrapper" id="tableWrapper" style="display: none;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>University Name</th>
            <th>State / Province</th>
            <th>Website</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const countryInput = document.getElementById('countryInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusText = document.getElementById('statusText');
    const tableWrapper = document.getElementById('tableWrapper');
    const resultsBody = document.getElementById('resultsBody');

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // Prevents page reload on form submit

      const country = countryInput.value.trim();
      if (!country) return;

      // Reset UI to loading state
      searchBtn.disabled = true;
      tableWrapper.style.display = 'none';
      resultsBody.innerHTML = '';
      statusText.textContent = `Fetching universities in "${country}"...`;

      try {
        // Call the Hipolabs Universities API
        const url = `http://universities.hipolabs.com/search?country=${encodeURIComponent(country)}`;
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`API returned status ${response.status}`);
        }

        const universities = await response.json();

        if (universities.length === 0) {
          statusText.textContent = `No universities found for "${country}". Check the spelling (e.g., "United States" instead of "USA").`;
          return;
        }

        statusText.textContent = `Found ${universities.length} universities in ${country}:`;
        tableWrapper.style.display = 'block';

        // Populate table rows
        universities.forEach((uni, index) => {
          const row = document.createElement('tr');

          // State field in Hipolabs API is named "state-province" (sometimes null)
          const stateText = uni['state-province']
            ? uni['state-province']
            : '<span class="badge-na">Not specified</span>';

          // Websites come as an array: uni.web_pages[0]
          const websiteUrl = uni.web_pages && uni.web_pages.length > 0 ? uni.web_pages[0] : '';
          const websiteLink = websiteUrl
            ? `<a href="${websiteUrl}" target="_blank" rel="noopener noreferrer">${websiteUrl}</a>`
            : '<span class="badge-na">N/A</span>';

          row.innerHTML = `
            <td>${index + 1}</td>
            <td><strong>${uni.name}</strong></td>
            <td>${stateText}</td>
            <td>${websiteLink}</td>
          `;

          resultsBody.appendChild(row);
        });
      } catch (error) {
        statusText.textContent = 'Error fetching data. Make sure you are connected to the internet and try again.';
        console.error(error);
      } finally {
        searchBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
